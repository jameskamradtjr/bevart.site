<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" style="background:#0b1329;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="amberBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1080" height="1080" fill="url(#bgGrad)" />
  
  <!-- Subtle Tech Grid / Accents -->
  <circle cx="150" cy="150" r="300" fill="url(#blueGlow)" filter="url(#glowEffect)" />
  <circle cx="950" cy="850" r="350" fill="url(#greenGlow)" filter="url(#glowEffect)" />
  <circle cx="900" cy="200" r="200" fill="url(#blueGlow)" filter="url(#glowEffect)" />

  <!-- Top Bar: Logo & Tag -->
  <g transform="translate(70, 65)">
    <!-- Bevart Tag / Brand -->
    <rect width="160" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="21" r="8" fill="#2563eb" />
    <text x="42" y="27" fill="#f8fafc" font-size="16" font-weight="800" letter-spacing="1">BEVART</text>

    <!-- Function Tag -->
    <rect x="180" y="0" width="220" height="42" rx="21" fill="#eff6ff" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="200" y="26" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="0.5">SST &amp; eSOCIAL SIMPLIFICADO</text>
  </g>

  <!-- Main Headline Block -->
  <g transform="translate(70, 160)">
    <!-- Subtitle Pill -->
    <rect width="310" height="34" rx="17" fill="url(#amberBadge)" />
    <text x="16" y="23" fill="#ffffff" font-size="13" font-weight="900" letter-spacing="1.2">NOVA SOLUÇÃO EXCLUSIVA</text>
    
    <!-- Title Line 1 -->
    <text x="0" y="90" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="-1.5">
      Recebeu ASO em Papel?
    </text>

    <!-- Title Line 2 Highlight -->
    <text x="0" y="152" fill="url(#primaryGrad)" font-size="48" font-weight="900" letter-spacing="-1">
      Transcreva e Envie o S-2220
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="202" fill="#94a3b8" font-size="21" font-weight="500">
      Transmita laudos físicos ao eSocial em 2 minutos, sem abrir prontuário fake!
    </text>
  </g>

  <!-- Visual Mockup Container (Two Cards Side by Side + Transformation) -->
  <g transform="translate(70, 410)">
    
    <!-- LEFT CARD: O ASO FÍSICO / PAPEL -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="420" height="380" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
      
      <!-- Card Header -->
      <rect width="420" height="60" rx="20" fill="#f1f5f9" />
      <rect y="45" width="420" height="15" fill="#f1f5f9" />
      <circle cx="35" cy="30" r="14" fill="#fee2e2" />
      <text x="29" y="36" fill="#ef4444" font-size="14" font-weight="bold">📄</text>
      <text x="60" y="36" fill="#334155" font-size="16" font-weight="800">ASO FÍSICO (PAPEL)</text>
      <rect x="290" y="16" width="105" height="28" rx="14" fill="#fee2e2" />
      <text x="305" y="34" fill="#dc2626" font-size="11" font-weight="800">CLÍNICA EXTERNA</text>

      <!-- Document Mock Lines -->
      <g transform="translate(30, 85)">
        <text x="0" y="16" fill="#64748b" font-size="12" font-weight="600">EMPRESA / TRABALHADOR:</text>
        <rect y="24" width="360" height="16" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
        
        <text x="0" y="65" fill="#64748b" font-size="12" font-weight="600">TIPO DE EXAME / APTIDÃO:</text>
        <rect y="73" width="170" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
        <text x="12" y="92" fill="#334155" font-size="13" font-weight="bold">Periódico</text>
        
        <rect x="190" y="73" width="170" height="28" rx="6" fill="#dcfce7" stroke="#86efac" />
        <text x="202" y="92" fill="#15803d" font-size="13" font-weight="bold">✓ APTO</text>

        <!-- Exam List -->
        <text x="0" y="130" fill="#64748b" font-size="12" font-weight="600">EXAMES COMPLEMENTARES:</text>
        <rect y="138" width="360" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="12" y="160" fill="#475569" font-size="12">• Avaliação Clínica + Audiometria</text>

        <!-- Doctor Stamp Mock -->
        <g transform="translate(190, 185)">
          <rect width="170" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="3,3" />
          <text x="12" y="25" fill="#1e40af" font-size="11" font-weight="bold">Dr. Carlos Mendes</text>
          <text x="12" y="42" fill="#3b82f6" font-size="11">CRM/SP 123456</text>
        </g>
      </g>
    </g>

    <!-- CENTER TRANSFORMATION ARROW -->
    <g transform="translate(435, 150)">
      <circle cx="35" cy="35" r="34" fill="#2563eb" filter="url(#shadow)" />
      <path d="M22 35 L48 35 M38 25 L48 35 L38 45" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <text x="35" y="88" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="800">BEVART</text>
      <text x="35" y="104" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">FORMULÁRIO</text>
    </g>

    <!-- RIGHT CARD: ESOCIAL S-2220 VALIDADO -->
    <g transform="translate(520, 0)" filter="url(#shadow)">
      <rect width="420" height="380" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" />
      
      <!-- Card Header -->
      <rect width="420" height="60" rx="20" fill="#1e293b" />
      <rect y="45" width="420" height="15" fill="#1e293b" />
      <circle cx="35" cy="30" r="14" fill="#dbeafe" />
      <text x="27" y="36" fill="#2563eb" font-size="14" font-weight="bold">⚡</text>
      <text x="60" y="36" fill="#ffffff" font-size="16" font-weight="800">EVENTO S-2220 ESOCIAL</text>
      
      <!-- Validated Pill -->
      <rect x="280" y="16" width="115" height="28" rx="14" fill="url(#badgeGrad)" />
      <text x="295" y="34" fill="#ffffff" font-size="11" font-weight="900">✓ VALIDADO</text>

      <!-- Digital System Fields Mock -->
      <g transform="translate(30, 85)">
        <text x="0" y="16" fill="#94a3b8" font-size="12" font-weight="600">MENSAGERIA GOV / ESOCIAL:</text>
        <rect y="24" width="360" height="30" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="12" y="44" fill="#38bdf8" font-size="12" font-weight="bold">XML Gerado &amp; Assinado (Certificado A1)</text>

        <text x="0" y="80" fill="#94a3b8" font-size="12" font-weight="600">TABELA 27 VINCULADA:</text>
        <rect y="88" width="360" height="32" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="12" y="109" fill="#4ade80" font-size="12">Cód. 0295 — Avaliação Clínica Ocupacional</text>

        <!-- Status Box -->
        <rect y="135" width="360" height="95" rx="10" fill="#0b1b36" stroke="#1d4ed8" stroke-width="1.5" />
        <text x="16" y="162" fill="#93c5fd" font-size="12" font-weight="700">PROTOCOLO / RECIBO ESOCIAL:</text>
        <text x="16" y="185" fill="#f8fafc" font-size="14" font-weight="bold">1.2.202608.0000000000123456</text>
        <text x="16" y="212" fill="#10b981" font-size="12" font-weight="bold">✓ Concluído • Histórico do Trabalhador Atualizado</text>
      </g>
    </g>

  </g>

  <!-- Bottom Badges / Selling Points -->
  <g transform="translate(70, 835)">
    <!-- Pill 1 -->
    <rect width="215" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="28" fill="#f8fafc" font-size="13.5" font-weight="700">⚡ Formulário Único</text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="225" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="255" y="28" fill="#f8fafc" font-size="13.5" font-weight="700">🔍 Tabela 27 Automática</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="225" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="500" y="28" fill="#f8fafc" font-size="13.5" font-weight="700">🏢 Envio com Procuração</text>

    <!-- Pill 4 -->
    <rect x="725" y="0" width="215" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="745" y="28" fill="#f8fafc" font-size="13.5" font-weight="700">📁 Ações em Lote</text>
  </g>

  <!-- Footer CTA Bar -->
  <g transform="translate(70, 920)">
    <rect width="940" height="85" rx="16" fill="url(#primaryGrad)" filter="url(#shadow)" />
    
    <text x="35" y="42" fill="#ffffff" font-size="20" font-weight="800">
      Software de SST Completo para Consultorias e Empresas
    </text>
    <text x="35" y="66" fill="#e0f2fe" font-size="14" font-weight="500">
      PGR • PCMSO • LTCAT • Ficha de EPI • eSocial S-2210, S-2220 e S-2240
    </text>

    <!-- Button -->
    <rect x="720" y="18" width="185" height="48" rx="24" fill="#ffffff" />
    <text x="745" y="48" fill="#1d4ed8" font-size="15" font-weight="900">bevart.com.br</text>
  </g>

</svg>
